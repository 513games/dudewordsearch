<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Canal 26 Elefen — News Generator</title>
  <style>
    :root {
      --accent-color: #d90429;
      --header-bg: #0d325e;
      --text-dark: #0e274a;
      --text-muted: #5c6f84;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* ================= EDITOR PANEL ================= */
    #editor-panel {
      width: 100%;
      max-width: 480px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .editor-header {
      margin-bottom: 16px;
    }

    .editor-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .editor-header p {
      font-size: 0.82rem;
      color: #94a3b8;
      line-height: 1.3;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-row .form-group {
      flex: 1;
    }

    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    input[type="text"],
    textarea,
    select {
      width: 100%;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #ffffff;
      padding: 10px 12px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    textarea:focus,
    select:focus {
      border-color: #38bdf8;
    }

    textarea {
      resize: vertical;
      min-height: 64px;
    }

    .file-input-wrapper {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .file-input-wrapper input[type="file"] {
      color: #94a3b8;
      font-size: 0.8rem;
      width: 100%;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #0f172a;
      border: 1px solid #334155;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      cursor: pointer;
    }

    .checkbox-group input {
      width: 18px;
      height: 18px;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    .checkbox-group span {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      cursor: pointer;
      font-weight: 700;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.9rem;
      border: none;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
      flex: 1.2;
    }

    .btn-secondary {
      background-color: #334155;
      color: #ffffff;
      flex: 1;
    }

    .btn-danger {
      background-color: #7f1d1d;
      color: #fecaca;
      width: 100%;
      margin-top: 10px;
    }

    /* ================= FLOATING RESTORE BUTTON ================= */
    #floating-editor-btn {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      background-color: #2563eb;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 999px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
      font-weight: 700;
      font-size: 0.85rem;
    }

    /* ================= PREVIEW MOCKUP ================= */
    #preview-container {
      width: 100%;
      max-width: 414px; /* Standard mobile viewport */
      background-color: #ffffff;
      color: var(--text-dark);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
    }

    /* Status Bar */
    .mock-status-bar {
      background-color: var(--header-bg);
      color: #ffffff;
      padding: 10px 18px 4px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
    }

    /* Main App Header */
    .mock-header {
      background-color: var(--header-bg);
      padding: 8px 16px 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .header-accent-line {
      height: 4px;
      background-color: var(--accent-color);
      width: 100%;
    }

    .hamburger-icon {
      width: 24px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
    }

    .hamburger-icon span {
      display: block;
      height: 3px;
      background-color: #ffffff;
      border-radius: 2px;
    }

    /* Channel Badge Logo */
    .channel-logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .channel-badge {
      background-color: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 8px;
      padding: 2px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 68px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }

    .badge-top {
      font-size: 0.55rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: var(--header-bg);
      text-transform: uppercase;
      line-height: 1;
      padding-top: 2px;
    }

    .badge-num {
      background-color: var(--accent-color);
      color: #ffffff;
      font-size: 1.25rem;
      font-weight: 900;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
      margin: 2px 0;
    }

    .badge-bottom {
      font-size: 0.52rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: var(--header-bg);
      text-transform: uppercase;
      line-height: 1;
      padding-bottom: 2px;
    }

    #custom-logo-img {
      max-height: 42px;
      max-width: 110px;
      object-fit: contain;
      display: none;
    }

    /* En Vivo Badge */
    .live-badge {
      background-color: var(--accent-color);
      color: #ffffff;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-transform: uppercase;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background-color: #ffffff;
      border-radius: 50%;
      display: inline-block;
    }

    /* Article Body */
    .mock-content {
      padding: 18px 18px 30px 18px;
      background-color: #ffffff;
    }

    .category-badge {
      display: inline-block;
      background-color: var(--accent-color);
      color: #ffffff;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      letter-spacing: 0.02em;
    }

    .headline {
      font-size: 1.55rem;
      font-weight: 900;
      line-height: 1.18;
      color: var(--text-dark);
      margin-bottom: 12px;
      word-wrap: break-word;
    }

    .subheadline {
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.35;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: none;
    }

    /* Article Image Area */
    .image-container {
      width: 100%;
      min-height: 260px;
      background: linear-gradient(180deg, #1b5394 0%, #0d325e 100%);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .image-placeholder-text {
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 700;
      text-align: center;
      padding: 24px;
      line-height: 1.3;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    .image-caption {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 6px;
      padding-left: 2px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- ================= CONTROL PANEL ================= -->
  <div id="editor-panel">
    <div class="editor-header">
      <h1>Canal 26 Elefen — Generator</h1>
      <p>Edit fields below. Tap <b>Apply changes</b> to update, and <b>Hide editor</b> for clean screenshots.</p>
    </div>

    <div class="form-group">
      <label>Category</label>
      <input type="text" id="input-category" value="Trafica">
    </div>

    <div class="form-group">
      <label>Headline</label>
      <textarea id="input-headline">Conjesta sin sorti sur autovia 89 entre Porto de Elefen e Santos.</textarea>
    </div>

    <div class="form-group">
      <label>Optional Subheadline</label>
      <textarea id="input-subheadline" placeholder="Leave blank if you don't want one."></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Time</label>
        <input type="text" id="input-time" value="10:45">
      </div>
      <div class="form-group">
        <label>Accent Color</label>
        <select id="input-accent">
          <option value="#d90429">News Red</option>
          <option value="#0284c7">Sky Blue</option>
          <option value="#16a34a">Emerald Green</option>
          <option value="#ea580c">Urgent Orange</option>
          <option value="#7c3aed">Royal Purple</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Article Image</label>
      <div class="file-input-wrapper">
        <input type="file" id="input-image" accept="image/*">
      </div>
    </div>

    <div class="form-group">
      <label>Image Caption</label>
      <input type="text" id="input-caption" placeholder="Optional photo caption">
    </div>

    <div class="form-group">
      <label>Custom Logo Image (Optional)</label>
      <div class="file-input-wrapper">
        <input type="file" id="input-logo" accept="image/*">
      </div>
    </div>

    <label class="checkbox-group">
      <input type="checkbox" id="input-live" checked>
      <span>Show EN VIVO badge</span>
    </label>

    <div class="btn-group">
      <button class="btn-primary" id="btn-apply">Apply changes</button>
      <button class="btn-secondary" id="btn-hide">Hide editor</button>
    </div>

    <button class="btn-danger" id="btn-reset">Reset text</button>
  </div>

  <button id="floating-editor-btn">Show Editor</button>

  <!-- ================= PHONE SCREEN PREVIEW ================= -->
  <div id="preview-container">
    <!-- Status Bar -->
    <div class="mock-status-bar">
      <span id="preview-time">10:45</span>
      <div class="status-icons">
        <span>5G</span>
        <span>Wi-Fi</span>
        <span>100%</span>
      </div>
    </div>

    <!-- Top Navigation -->
    <div class="mock-header">
      <div class="hamburger-icon">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="channel-logo-container">
        <div class="channel-badge" id="default-badge">
          <span class="badge-top">CANAL</span>
          <span class="badge-num">26</span>
          <span class="badge-bottom">ELEFEN</span>
        </div>
        <img id="custom-logo-img" alt="Logo">
      </div>

      <div class="live-badge" id="preview-live">
        <span class="live-dot"></span> EN VIVO
      </div>
    </div>
    
    <div class="header-accent-line"></div>

    <!-- News Story Content -->
    <div class="mock-content">
      <div class="category-badge" id="preview-category">Trafica</div>
      <h2 class="headline" id="preview-headline">Conjesta sin sorti sur autovia 89 entre Porto de Elefen e Santos.</h2>
      <p class="subheadline" id="preview-subheadline"></p>

      <div class="image-container" id="image-container">
        <img id="preview-img" alt="News Story Photo">
        <div class="image-placeholder-text" id="preview-placeholder-text">
          Upload a news image<br>to replace this background.
        </div>
      </div>
      <div class="image-caption" id="preview-caption"></div>
    </div>
  </div>

  <!-- ================= JAVASCRIPT LOGIC ================= -->
  <script>
    // Get Elements
    const inCategory = document.getElementById('input-category');
    const inHeadline = document.getElementById('input-headline');
    const inSubheadline = document.getElementById('input-subheadline');
    const inTime = document.getElementById('input-time');
    const inAccent = document.getElementById('input-accent');
    const inImage = document.getElementById('input-image');
    const inCaption = document.getElementById('input-caption');
    const inLogo = document.getElementById('input-logo');
    const inLive = document.getElementById('input-live');

    const outCategory = document.getElementById('preview-category');
    const outHeadline = document.getElementById('preview-headline');
    const outSubheadline = document.getElementById('preview-subheadline');
    const outTime = document.getElementById('preview-time');
    const outLive = document.getElementById('preview-live');
    const outCaption = document.getElementById('preview-caption');
    const outImg = document.getElementById('preview-img');
    const outPlaceholderText = document.getElementById('preview-placeholder-text');
    const defaultBadge = document.getElementById('default-badge');
    const customLogoImg = document.getElementById('custom-logo-img');

    const editorPanel = document.getElementById('editor-panel');
    const floatingBtn = document.getElementById('floating-editor-btn');

    // Update Text & Colors
    function updatePreview() {
      // Category
      outCategory.textContent = inCategory.value.trim() || 'Notisia';
      
      // Headline
      outHeadline.textContent = inHeadline.value.trim() || 'Headline goes here';
      
      // Subheadline
      if (inSubheadline.value.trim()) {
        outSubheadline.textContent = inSubheadline.value.trim();
        outSubheadline.style.display = 'block';
      } else {
        outSubheadline.style.display = 'none';
      }

      // Time
      outTime.textContent = inTime.value.trim() || '10:45';

      // Accent Color
      document.documentElement.style.setProperty('--accent-color', inAccent.value);

      // Live Badge Toggle
      outLive.style.display = inLive.checked ? 'inline-flex' : 'none';

      // Caption
      if (inCaption.value.trim()) {
        outCaption.textContent = inCaption.value.trim();
        outCaption.style.display = 'block';
      } else {
        outCaption.style.display = 'none';
      }
    }

    // Handle Article Image Upload
    inImage.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          outImg.src = evt.target.result;
          outImg.style.display = 'block';
          outPlaceholderText.style.display = 'none';
        };
        reader.readAsDataURL(file);
      }
    });

    // Handle Custom Logo Upload
    inLogo.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          customLogoImg.src = evt.target.result;
          customLogoImg.style.display = 'block';
          defaultBadge.style.display = 'none';
        };
        reader.readAsDataURL(file);
      } else {
        customLogoImg.style.display = 'none';
        defaultBadge.style.display = 'flex';
      }
    });

    // Event Listeners for Live Updates
    [inCategory, inHeadline, inSubheadline, inTime, inCaption, inAccent, inLive].forEach(elem => {
      elem.addEventListener('input', updatePreview);
      elem.addEventListener('change', updatePreview);
    });

    // Explicit Apply Button
    document.getElementById('btn-apply').addEventListener('click', updatePreview);

    // Hide/Show Editor Toggle
    document.getElementById('btn-hide').addEventListener('click', function() {
      editorPanel.style.display = 'none';
      floatingBtn.style.display = 'block';
      window.scrollTo(0, 0);
    });

    floatingBtn.addEventListener('click', function() {
      editorPanel.style.display = 'block';
      floatingBtn.style.display = 'none';
    });

    // Reset Defaults
    document.getElementById('btn-reset').addEventListener('click', function() {
      inCategory.value = 'Trafica';
      inHeadline.value = 'Conjesta sin sorti sur autovia 89 entre Porto de Elefen e Santos.';
      inSubheadline.value = '';
      inTime.value = '10:45';
      inCaption.value = '';
      inAccent.value = '#d90429';
      inLive.checked = true;
      
      outImg.src = '';
      outImg.style.display = 'none';
      outPlaceholderText.style.display = 'block';
      
      customLogoImg.src = '';
      customLogoImg.style.display = 'none';
      defaultBadge.style.display = 'flex';
      
      inImage.value = '';
      inLogo.value = '';

      updatePreview();
    });

    // Initial run
    updatePreview();
  </script>
</body>
</html>
