function buildDictionary() {
  const dictionary = [];
  const lines = VOCABULARY.split("\n");

  for (const line of lines) {
    const trimmed = line.trim();

    if (!trimmed) continue;
    if (trimmed.startsWith("#")) continue;
    if (!trimmed.includes("=")) continue;

    const parts = trimmed.split("=");
    const english = parts.shift().trim().toLowerCase();
    const rightSide = parts.join("=").trim();

    // Optional label after a pipe:
    // word = parola | noun
    const metaParts = rightSide.split("|");
    const elefen = metaParts[0].trim();
    const type = metaParts.length > 1
      ? metaParts.slice(1).join("|").trim().toLowerCase()
      : "";

    if (english && elefen) {
      dictionary.push({
        english,
        elefen,
        type,
        words: english.split(/\s+/)
      });
    }
  }

  // Check longer phrases before shorter words.
  dictionary.sort((a, b) => {
    if (b.words.length !== a.words.length) {
      return b.words.length - a.words.length;
    }
    return b.english.length - a.english.length;
  });

  return dictionary;
}

const dictionary = buildDictionary();


function isWord(text) {
  return /^[A-Za-zÀ-ÖØ-öø-ÿ']+$/.test(text);
}


function preserveCapitalization(original, translation) {
  if (
    original === original.toUpperCase() &&
    /[A-Za-z]/.test(original)
  ) {
    return translation.toUpperCase();
  }

  if (
    original &&
    original.charAt(0) === original.charAt(0).toUpperCase()
  ) {
    return translation.charAt(0).toUpperCase() + translation.slice(1);
  }

  return translation;
}


function phraseMatches(tokens, startIndex, words) {
  let tokenIndex = startIndex;

  for (let wordIndex = 0; wordIndex < words.length; wordIndex++) {

    // Skip spaces between words in a phrase.
    while (
      tokenIndex < tokens.length &&
      /^\s+$/.test(tokens[tokenIndex])
    ) {
      tokenIndex++;
    }

    if (tokenIndex >= tokens.length) return null;
    if (!isWord(tokens[tokenIndex])) return null;

    const currentWord = tokens[tokenIndex].toLowerCase();

    if (currentWord !== words[wordIndex]) {
      return null;
    }

    tokenIndex++;
  }

  return tokenIndex - 1;
}


/*
=========================================================
AUTOMATIC ELEFEN NOUN PLURALS

If the vocabulary says:

word = parola | noun

then:

word  -> parola
words -> parolas

Elefen rule used here:
vowel ending     -> +s
consonant ending -> +es
=========================================================
*/

function makeElefenPlural(word) {
  if (/[aeiou]$/i.test(word)) {
    return word + "s";
  }

  return word + "es";
}


function findNoun(englishSingular) {
  return dictionary.find(entry =>
    entry.type === "noun" &&
    entry.english === englishSingular
  );
}


function translatePluralNoun(word) {
  const lower = word.toLowerCase();

  // A few common irregular English plurals.
  const irregularPlurals = {
    people: "person",
    men: "man",
    women: "woman",
    children: "child"
  };

  if (irregularPlurals[lower]) {
    const noun = findNoun(irregularPlurals[lower]);

    if (noun) {
      return makeElefenPlural(noun.elefen);
    }
  }

  const possibleSingulars = [];

  // cities -> city, countries -> country
  if (lower.endsWith("ies") && lower.length > 3) {
    possibleSingulars.push(lower.slice(0, -3) + "y");
  }

  // houses -> house, words -> word
  if (lower.endsWith("s") && lower.length > 1) {
    possibleSingulars.push(lower.slice(0, -1));
  }

  // buses -> bus, boxes -> box
  if (lower.endsWith("es") && lower.length > 2) {
    possibleSingulars.push(lower.slice(0, -2));
  }

  // Try each possible singular form.
  for (const singular of [...new Set(possibleSingulars)]) {
    const noun = findNoun(singular);

    if (noun) {
      return makeElefenPlural(noun.elefen);
    }
  }

  return null;
}


/*
=========================================================
PAST YES/NO QUESTIONS

Did you study?
-> Esce tu ia studia?

"did" creates:
Esce + subject + ia + base verb
=========================================================
*/

function translatePastQuestion(text) {
  const match = text
    .trim()
    .match(/^did\s+(i|you|he|she|we|they)\s+(.+?)[?.!]*$/i);

  if (!match) return null;

  const subjectMap = {
    i: "me",
    you: "tu",
    he: "el",
    she: "el",
    we: "nos",
    they: "los"
  };

  const englishSubject = match[1].toLowerCase();
  const restOfSentence = match[2].trim();

  // Translate the rest normally, without applying the
  // "Did..." rule again.
  const translatedRest = translateNormalSentence(restOfSentence);

  return (
    "Esce " +
    subjectMap[englishSubject] +
    " ia " +
    translatedRest +
    "?"
  );
}


function translateNormalSentence(text) {
  const tokens =
    text.match(/[A-Za-zÀ-ÖØ-öø-ÿ']+|\s+|[^\sA-Za-zÀ-ÖØ-öø-ÿ']+/g)
    || [];

  let output = "";

  for (let i = 0; i < tokens.length; i++) {
    const token = tokens[i];

    // Keep spaces and punctuation.
    if (!isWord(token)) {
      output += token;
      continue;
    }

    let matchFound = false;

    // First try exact vocabulary words and phrases.
    for (const entry of dictionary) {
      const result = phraseMatches(tokens, i, entry.words);

      if (result !== null) {
        output += preserveCapitalization(token, entry.elefen);
        i = result;
        matchFound = true;
        break;
      }
    }

    if (!matchFound) {
      // If no exact entry exists, see whether this looks like
      // the plural of a noun marked "| noun".
      const pluralTranslation = translatePluralNoun(token);

      if (pluralTranslation) {
        output += preserveCapitalization(token, pluralTranslation);
      } else {
        // Unknown words stay in English.
        output += token;
      }
    }
  }

  return output;
}


function translateSentence(text) {
  const pastQuestion = translatePastQuestion(text);

  if (pastQuestion !== null) {
    return pastQuestion;
  }

  return translateNormalSentence(text);
}


function translateText() {
  const input = document.getElementById("english").value;
  const output = translateSentence(input);
  document.getElementById("elefen").value = output;
}


// Connect the button.
document
  .getElementById("translateButton")
  .addEventListener("click", translateText);


// Optional: Ctrl+Enter / Cmd+Enter translates too.
document
  .getElementById("english")
  .addEventListener("keydown", function (event) {
    if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
      translateText();
    }
  });

</script>
