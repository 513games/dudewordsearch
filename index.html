function buildDictionary() {
  const dictionary = [];
  const lines = VOCABULARY.split("\n");

  for (const line of lines) {
    const trimmed = line.trim();

    if (!trimmed) continue;
    if (trimmed.startsWith("#")) continue;
    if (!trimmed.includes("=")) continue;

    const parts = trimmed.split("=");
    const english = parts.shift().trim().toLowerCase();
    const rightSide = parts.join("=").trim();

    /*
    Optional grammar label:

    word = parola | noun
    learn = aprende | verb
    */

    const metaParts = rightSide.split("|");

    const elefen = metaParts[0].trim();

    const type =
      metaParts.length > 1
        ? metaParts.slice(1).join("|").trim().toLowerCase()
        : "";

    if (english && elefen) {
      dictionary.push({
        english,
        elefen,
        type,
        words: english.split(/\s+/)
      });
    }
  }

  // Longer phrases are checked first.
  dictionary.sort((a, b) => {

    if (b.words.length !== a.words.length) {
      return b.words.length - a.words.length;
    }

    return b.english.length - a.english.length;
  });

  return dictionary;
}


const dictionary = buildDictionary();


function isWord(text) {
  return /^[A-Za-zÀ-ÖØ-öø-ÿ']+$/.test(text);
}


/*
=========================================================
VERB HELPERS
=========================================================
*/

function isVerb(word) {

  if (!word) return false;

  const lower = word.toLowerCase();

  return dictionary.some(entry =>
    entry.english === lower &&
    entry.type === "verb"
  );
}


function previousWord(tokens, index) {

  for (let i = index - 1; i >= 0; i--) {

    if (isWord(tokens[i])) {
      return tokens[i];
    }

  }

  return null;
}


function nextWord(tokens, index) {

  for (let i = index + 1; i < tokens.length; i++) {

    if (isWord(tokens[i])) {
      return tokens[i];
    }

  }

  return null;
}


/*
=========================================================
CAPITALIZATION
=========================================================
*/

function preserveCapitalization(original, translation) {

  // Special case for English "I"
  if (original === "I") {
    return (
      translation.charAt(0).toUpperCase() +
      translation.slice(1)
    );
  }

  if (
    original === original.toUpperCase() &&
    /[A-Za-z]/.test(original)
  ) {
    return translation.toUpperCase();
  }

  if (
    original &&
    original.charAt(0) === original.charAt(0).toUpperCase()
  ) {
    return (
      translation.charAt(0).toUpperCase() +
      translation.slice(1)
    );
  }

  return translation;
}


/*
=========================================================
PHRASE MATCHING
=========================================================
*/

function phraseMatches(tokens, startIndex, words) {

  let tokenIndex = startIndex;

  for (
    let wordIndex = 0;
    wordIndex < words.length;
    wordIndex++
  ) {

    // Skip spaces between words.
    while (
      tokenIndex < tokens.length &&
      /^\s+$/.test(tokens[tokenIndex])
    ) {
      tokenIndex++;
    }

    if (tokenIndex >= tokens.length) {
      return null;
    }

    if (!isWord(tokens[tokenIndex])) {
      return null;
    }

    const currentWord =
      tokens[tokenIndex].toLowerCase();

    if (currentWord !== words[wordIndex]) {
      return null;
    }

    tokenIndex++;
  }

  return tokenIndex - 1;
}


/*
=========================================================
AUTOMATIC ELEFEN NOUN PLURALS

word = parola | noun

word  -> parola
words -> parolas

Vowel ending     -> +s
Consonant ending -> +es
=========================================================
*/

function makeElefenPlural(word) {

  if (/[aeiou]$/i.test(word)) {
    return word + "s";
  }

  return word + "es";
}


function findNoun(englishSingular) {

  return dictionary.find(entry =>
    entry.type === "noun" &&
    entry.english === englishSingular
  );
}

function isNoun(word) {

  if (!word) return false;

  const lower = word.toLowerCase();

  // Exact singular noun
  if (
    dictionary.some(entry =>
      entry.type === "noun" &&
      entry.english === lower
    )
  ) {
    return true;
  }

  // Recognized plural noun
  if (translatePluralNoun(lower)) {
    return true;
  }

  return false;
}



function translatePluralNoun(word) {

  const lower = word.toLowerCase();


  /*
  Common irregular English plurals
  */

  const irregularPlurals = {
    people: "person",
    men: "man",
    women: "woman",
    children: "child"
  };


  if (irregularPlurals[lower]) {

    const noun =
      findNoun(irregularPlurals[lower]);

    if (noun) {
      return makeElefenPlural(noun.elefen);
    }
  }


  const possibleSingulars = [];


  // cities -> city
  // countries -> country

  if (
    lower.endsWith("ies") &&
    lower.length > 3
  ) {

    possibleSingulars.push(
      lower.slice(0, -3) + "y"
    );
  }


  // words -> word
  // houses -> house

  if (
    lower.endsWith("s") &&
    lower.length > 1
  ) {

    possibleSingulars.push(
      lower.slice(0, -1)
    );
  }


  // buses -> bus
  // boxes -> box

  if (
    lower.endsWith("es") &&
    lower.length > 2
  ) {

    possibleSingulars.push(
      lower.slice(0, -2)
    );
  }


  for (
    const singular of [...new Set(possibleSingulars)]
  ) {

    const noun = findNoun(singular);

    if (noun) {
      return makeElefenPlural(noun.elefen);
    }
  }


  return null;
}


/*
=========================================================
PAST YES / NO QUESTIONS

Did you study?
→ Esce tu ia studia?

Did he study the words?
→ Esce el ia studia la parolas?
=========================================================
*/

function translatePastQuestion(text) {

  const match =
    text
      .trim()
      .match(
        /^did\s+(i|you|he|she|we|they)\s+(.+?)[?.!]*$/i
      );


  if (!match) {
    return null;
  }


  const subjectMap = {

    i: "me",
    you: "tu",
    he: "el",
    she: "el",
    we: "nos",
    they: "los"

  };


  const englishSubject =
    match[1].toLowerCase();


  const restOfSentence =
    match[2].trim();


  const translatedRest =
    translateNormalSentence(restOfSentence);


  return (
    "Esce " +
    subjectMap[englishSubject] +
    " ia " +
    translatedRest +
    "?"
  );
}


/*
=========================================================
ADJECTIVE / ADVERB WORD ORDER

Vocabulary labels supported:
blue = blu | adjective
quickly = rapida | adverb

Short labels also work:
blue = blu | adj
quickly = rapida | adv

Rules implemented here:

English:  the blue car
Elefen:   la auto blu

English:  the good blue car
Elefen:   la bon auto blu

English:  the very good car
Elefen:   la auto multe bon

English:  he quickly studies
Elefen:   el studia rapida

bon and mal are the adjective exceptions. Unmodified,
they stay BEFORE the noun. If bon or mal is itself
modified (for example, "very good"), the whole group
moves after the noun. Adverbs that modify adjectives stay
with the adjective, so "the very blue car" becomes
"la auto multe blu" after translation.
=========================================================
*/

function getSingleWordEntries(word) {

  if (!word) return [];

  const lower = word.toLowerCase();

  return dictionary.filter(entry =>
    entry.words.length === 1 &&
    entry.english === lower
  );
}


function hasGrammarType(word, ...types) {

  return getSingleWordEntries(word).some(entry =>
    types.includes(entry.type)
  );
}


function isAdjective(word) {
  return hasGrammarType(word, "adjective", "adj");
}


function isAdverb(word) {
  return hasGrammarType(word, "adverb", "adv");
}


function isBonOrMalAdjective(word) {

  return getSingleWordEntries(word).some(entry => {

    if (entry.type !== "adjective" && entry.type !== "adj") {
      return false;
    }

    const elefen = entry.elefen.toLowerCase();

    return elefen === "bon" || elefen === "mal";
  });
}


function lowercaseFirstLetter(word) {
  if (!word) return word;
  return word.charAt(0).toLowerCase() + word.slice(1);
}


function uppercaseFirstLetter(word) {
  if (!word) return word;
  return word.charAt(0).toUpperCase() + word.slice(1);
}


/*
Reorder only WORD VALUES while leaving all spaces and
punctuation in their original token positions. This keeps
commas, question marks, etc. intact.
*/
function reorderElefenGrammar(text) {

  const tokens =
    text.match(
      /[A-Za-zÀ-ÖØ-öø-ÿ']+|\s+|[^\sA-Za-zÀ-ÖØ-öø-ÿ']+/g
    ) || [];


  /*
  Split the sentence into runs of words separated only by
  whitespace. Punctuation ends a run, so grammar movement
  never jumps across a comma, period, question mark, etc.
  */
  const runs = [];
  let currentRun = [];

  for (let i = 0; i < tokens.length; i++) {

    if (isWord(tokens[i])) {
      currentRun.push(i);
      continue;
    }

    if (/^\s+$/.test(tokens[i])) {
      continue;
    }

    if (currentRun.length) {
      runs.push(currentRun);
      currentRun = [];
    }
  }

  if (currentRun.length) {
    runs.push(currentRun);
  }


  for (const wordIndexes of runs) {

    let words = wordIndexes.map(index => tokens[index]);


    /*
    -----------------------------------------------------
    ADJECTIVES

    adjective + noun
    -> noun + adjective

    adjective + adjective + noun
    -> noun + adjective + adjective

    BUT bon / mal stay before the noun.

    Adverbs directly attached to an adjective travel with
    that adjective:

    very + blue + car
    -> car + very + blue
    -----------------------------------------------------
    */
    for (let nounIndex = words.length - 1;
         nounIndex >= 0;
         nounIndex--) {

      if (!isNoun(words[nounIndex])) continue;

      let modifierStart = nounIndex;

      while (
        modifierStart > 0 &&
        (
          isAdjective(words[modifierStart - 1]) ||
          isAdverb(words[modifierStart - 1])
        )
      ) {
        modifierStart--;
      }

      if (modifierStart === nounIndex) continue;

      const modifiers =
        words.slice(modifierStart, nounIndex);

      if (!modifiers.some(isAdjective)) continue;


      /*
      Build adjective groups. Any adverb immediately before
      an adjective belongs to that adjective group.

      very good big car
      groups: [very good] [big]
      */
      const groups = [];
      let pendingAdverbs = [];

      for (const modifier of modifiers) {

        if (isAdverb(modifier)) {
          pendingAdverbs.push(modifier);
          continue;
        }

        if (isAdjective(modifier)) {
          groups.push({
            words: [...pendingAdverbs, modifier],
            adjective: modifier
          });
          pendingAdverbs = [];
        }
      }

      // Do not move a dangling adverb with no adjective.
      if (pendingAdverbs.length) continue;

      const beforeNoun = [];
      const afterNoun = [];

      for (const group of groups) {

        const hasAdverbModifier =
          group.words.length > 1;

        /*
        bon / mal normally stay before the noun, but the
        official Elefen grammar places them after the noun
        when they are themselves modified:

        a good dog       -> un bon can
        a very good dog  -> un can multe bon
        */
        if (
          isBonOrMalAdjective(group.adjective) &&
          !hasAdverbModifier
        ) {
          beforeNoun.push(...group.words);
        } else {
          afterNoun.push(...group.words);
        }
      }

      const noun = words[nounIndex];

      const replacement = [
        ...beforeNoun,
        noun,
        ...afterNoun
      ];


      /*
      If an adjective started the sentence and moves behind
      the noun, transfer normal sentence capitalization to
      the new first word.
      */
      if (
        modifierStart === 0 &&
        wordIndexes[0] === 0 &&
        /^[A-Z]/.test(words[0]) &&
        replacement.length > 1
      ) {

        const movedOriginalFirst =
          replacement.indexOf(words[0]);

        if (movedOriginalFirst > 0) {
          replacement[movedOriginalFirst] =
            lowercaseFirstLetter(
              replacement[movedOriginalFirst]
            );
        }

        replacement[0] =
          uppercaseFirstLetter(replacement[0]);
      }


      words.splice(
        modifierStart,
        nounIndex - modifierStart + 1,
        ...replacement
      );
    }


    /*
    -----------------------------------------------------
    ADVERBS MODIFYING VERBS

    quickly + studies
    -> studies + quickly

    really + quickly + studies
    -> studies + really + quickly

    This only moves adverbs that are immediately before a
    verb. It does NOT move an adverb before an adjective,
    so "very blue" remains together.
    -----------------------------------------------------
    */
    for (let verbIndex = words.length - 1;
         verbIndex >= 0;
         verbIndex--) {

      if (!isVerb(words[verbIndex])) continue;

      let adverbStart = verbIndex;

      while (
        adverbStart > 0 &&
        isAdverb(words[adverbStart - 1])
      ) {
        adverbStart--;
      }

      if (adverbStart === verbIndex) continue;

      const adverbs =
        words.slice(adverbStart, verbIndex);

      const verb = words[verbIndex];

      const replacement = [
        verb,
        ...adverbs
      ];


      if (
        adverbStart === 0 &&
        wordIndexes[0] === 0 &&
        /^[A-Z]/.test(words[0]) &&
        replacement.length > 1
      ) {

        replacement[replacement.length - 1] =
          lowercaseFirstLetter(
            replacement[replacement.length - 1]
          );

        replacement[0] =
          uppercaseFirstLetter(replacement[0]);
      }


      words.splice(
        adverbStart,
        verbIndex - adverbStart + 1,
        ...replacement
      );
    }


    // Put the reordered words back into their token slots.
    for (let i = 0; i < wordIndexes.length; i++) {
      tokens[wordIndexes[i]] = words[i];
    }
  }


  return tokens.join("");
}


/*
=========================================================
NORMAL TRANSLATION
=========================================================
*/

function translateNormalSentence(text) {

  // First reshape English adjective/adverb order into
  // the Elefen word order described by the grammar labels.
  const reorderedText =
    reorderElefenGrammar(text);

  const tokens =
    reorderedText.match(
      /[A-Za-zÀ-ÖØ-öø-ÿ']+|\s+|[^\sA-Za-zÀ-ÖØ-öø-ÿ']+/g
    ) || [];


  let output = "";


  for (
    let i = 0;
    i < tokens.length;
    i++
  ) {

    const token = tokens[i];


    /*
    Keep spaces and punctuation.
    */

    if (!isWord(token)) {

      output += token;

      continue;
    }


    /*
    =====================================================
    RELATIVE "THAT"

    that car
    → acel auto

    the car that I bought
    → la auto cual me ia compra

    the cars that I bought
    → la autos cual me ia compra
    =====================================================
    */

    if (token.toLowerCase() === "that") {

      const before =
        previousWord(tokens, i);

      const after =
        nextWord(tokens, i);

      /*
      Relative-clause starters.

      This catches:
      the bananas that I gave you
      the car that he bought
      the cars that are blue

      even if the noun before "that"
      has not been added to the dictionary yet.
      */
      const relativeStarters = [
        "i", "you", "he", "she", "it", "we", "they",
        "am", "is", "are", "was", "were",
        "have", "has", "had",
        "do", "does", "did",
        "will", "would", "can", "could",
        "should", "must"
      ];

      const looksLikeRelativeClause =
        before &&
        after &&
        (
          isNoun(before) ||
          relativeStarters.includes(after.toLowerCase()) ||
          isVerb(after)
        );

      if (looksLikeRelativeClause) {

        output += preserveCapitalization(
          token,
          "cual"
        );

        continue;
      }
    }



    /*
    =====================================================
    REMOVE ENGLISH "TO" BETWEEN TWO VERBS

    needs to learn
    → nesesa aprende

    wants to study
    → vole studia

    tries to help
    → atenta aida

    BUT:

    go to school
    → vade a la scola

    because school is NOT a verb.
    =====================================================
    */

    if (token.toLowerCase() === "to") {

      const before =
        previousWord(tokens, i);

      const after =
        nextWord(tokens, i);


      if (
        before &&
        after &&
        isVerb(before) &&
        isVerb(after)
      ) {

        /*
        Skip "to".

        There is already a space before "to",
        so also skip the space immediately
        after "to".
        */

        if (
          i + 1 < tokens.length &&
          /^\s+$/.test(tokens[i + 1])
        ) {

          i++;

        }

        continue;
      }
    }


    let matchFound = false;


    /*
    First try exact vocabulary entries
    and longer phrases.
    */

    for (const entry of dictionary) {

      const result =
        phraseMatches(
          tokens,
          i,
          entry.words
        );


      if (result !== null) {

        output +=
          preserveCapitalization(
            token,
            entry.elefen
          );


        i = result;

        matchFound = true;

        break;
      }
    }


    /*
    No exact vocabulary match?

    Check whether it is automatically
    recognizable as a plural noun.
    */

    if (!matchFound) {

      const pluralTranslation =
        translatePluralNoun(token);


      if (pluralTranslation) {

        output +=
          preserveCapitalization(
            token,
            pluralTranslation
          );

      } else {

        // Unknown words stay English.
        output += token;

      }
    }
  }


  return output;
}


/*
=========================================================
MAIN SENTENCE TRANSLATOR
=========================================================
*/

function translateSentence(text) {

  const pastQuestion =
    translatePastQuestion(text);


  if (pastQuestion !== null) {

    return pastQuestion;

  }


  return translateNormalSentence(text);
}


/*
=========================================================
TRANSLATE BUTTON
=========================================================
*/

function translateText() {

  const input =
    document.getElementById("english").value;


  /*
  Split the paragraph into individual sentences.

  This lets grammar rules work on EACH sentence,
  not just the first sentence in the textbox.
  */

  const sentences =
    input.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [];


  const translated =
    sentences.map(sentence => {

      // Preserve spaces before each sentence.
      const leadingSpaces =
        sentence.match(/^\s*/)[0];

      const cleanSentence =
        sentence.trimStart();

      return (
        leadingSpaces +
        translateSentence(cleanSentence)
      );

    }).join("");


  document.getElementById("elefen").value =
    translated;
}


/*
Connect Translate button
*/

document
  .getElementById("translateButton")
  .addEventListener(
    "click",
    translateText
  );


/*
Ctrl + Enter or Cmd + Enter
also translates.
*/

document
  .getElementById("english")
  .addEventListener(
    "keydown",
    function (event) {

      if (
        (event.ctrlKey || event.metaKey) &&
        event.key === "Enter"
      ) {

        translateText();

      }
    }
  );

</script>
